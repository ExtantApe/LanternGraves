name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leak check
        run: bash scripts/leak-check.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the version
        run: |
          version=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match build version $version" >&2
            exit 1
          fi
      - run: ./gradlew build
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/libs
          sha256sum LanternGraves-*.jar | tee LanternGraves.sha256
          cd ../..
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then how=(--notes-file "$notes"); else how=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" build/libs/LanternGraves-*.jar build/libs/LanternGraves.sha256 --title "LanternGraves ${GITHUB_REF_NAME#v}" "${how[@]}"
